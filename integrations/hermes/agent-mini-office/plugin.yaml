name: agent-mini-office
version: "0.3.0"
description: Report observed session activity and receive assigned AgentMiniOffice tasks on supported Hermes hosts.
author: IndraFer - KoiN Codeveloper
provides_hooks:
  - post_gateway_admission
  - on_session_open
  - on_session_start
  - on_session_reset
  - on_session_finalize
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - on_human_input_request
  - on_human_input_resolved
  - subagent_start
  - subagent_stop
  - post_compaction
